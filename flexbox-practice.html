<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flexbox — Карточки товаров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Наши товары</h1>

    <div class="products-container">
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Кроссовки">
            <h3>Кроссовки Nike</h3>
            <p class="price">12 990 ₽</p>
            <button>Купить</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Футболка">
            <h3>Футболка Adidas</h3>
            <p class="price">2 490 ₽</p>
            <button>Купить</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Наушники">
            <h3>Наушники Sony</h3>
            <p class="price">8 990 ₽</p>
            <button>Купить</button>
        </div>
    </div>

    <div class="my-products">
        <div class="tech-card-hit">
            <h4 class="hot">ГОРЯЧАЯ СКИДКА</h4>
            <img src="https://via.placeholder.com/300x200" alt="Phone">
            <h3>Xiaomi M3</h3>
            <p class="price">10 000</p>
            <button>Купить</button>
        </div>
        <div class="tech-card">
            <img src="https://via.placeholder.com/300x200" alt="Glass">
            <h3>Защитное стекло</h3>
            <p class="price">500</p>
            <button>Купить</button>
        </div>
        <div class="tech-card">
            <img src="https://via.placeholder.com/300x200" alt="Case">
            <h3>Чехол для Xiaomi</h3>
            <p class="price">1 000</p>
            <button>Купить</button>
        </div>
    </div>>

</body>
</html>
